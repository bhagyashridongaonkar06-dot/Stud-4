<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task 4</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <div class="container">
        <h2 class="bg-warning text-center text-white m-2 p-2"><span class="text-danger">*</span>Customer Form<span class="text-danger">*</span></h2>
        <div class="row">
            <div class="col-md-6 mt-5 offset-3">
                <div class="card">
                    <form action="" id="customerForm">
                        <div class="card-body">
                            <h4 class="bg-primary text-center text-white heading">Customer Information</h4>
                           <div class="form-row">
                             <div class="col-md-6">
                                <div class="form-group">
                                    <label for="name">Enter Name Here<span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="name">
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="email">Enter email Here<span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="email">
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="contact">Enter contact Here<span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="contact">
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="city">Enter city Here<span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="city">
                                </div>
                            </div>

                           </div>
                            <button type="submit" class="btn btn-primary btn-sm btn-block" id="addCustBtn">Add Customer</button>
                            <button type="button" class="btn btn-primary btn-sm btn-block d-none" id="updateCustBtn">Update Customer</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="cintainer-fluid">
        <div class="row">
            <div class="col-md-10 offset-1 mt-5">
                <div class="card">
                    <div class="card-body table-responsive">
                        <table class="table table-bordered table-hover">
                            <thead>
                                <tr>
                                    <th>Sr No</th>
                                    <th>Customer Name</th>
                                    <th>Email</th>
                                    <th>Contact</th>
                                    <th>City</th>
                                    <th>Edit</th>
                                    <th>Remove</th>
                                </tr>
                            </thead>

                            <tbody id="customerTable">
                                <!-- <tr>
                                    <td>1</td>
                                    <td>1</td>
                                    <td>1</td>
                                    <td>1</td>
                                    <td>1</td>
                                    <td><button type="button" class="btn btn-primary btn-sm">Edit</button></td>
                                    <td><button type="button" class="btn btn-danger btn-sm">Remove</button></td>
                                </tr> -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>




    <script src="./assets/js/app.js"></script>
</body>
</html>
